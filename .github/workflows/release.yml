name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-agent-release-archives
          path: dist/releases/*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --pack-destination ../../dist/releases
        working-directory: adapters/opencode
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-npm-package
          path: dist/releases/*.tgz
